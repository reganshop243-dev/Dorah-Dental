<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dora's Dental Gem - {% block title %}OTP Verification{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .otp-wrapper {
            width: 100%;
            max-width: 450px;
        }
        
        .otp-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 45px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: slideUp 0.8s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo-icon {
            display: inline-block;
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            line-height: 80px;
            font-size: 40px;
            color: white;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            margin-bottom: 15px;
        }
        
        .clinic-name {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 700;
            color: #2d3436;
            margin-bottom: 5px;
        }
        
        .clinic-name span {
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .clinic-tagline {
            color: #636e72;
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 2px;
        }
        
        .otp-title {
            font-size: 22px;
            font-weight: 600;
            color: #2d3436;
            margin-bottom: 8px;
            text-align: center;
        }
        
        .otp-subtitle {
            color: #636e72;
            font-size: 14px;
            margin-bottom: 25px;
            text-align: center;
        }
        
        .otp-input {
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 10px;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #dee2e6;
            transition: all 0.3s;
        }
        
        .otp-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        
        .btn-verify {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            width: 100%;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-verify:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(102, 126, 234, 0.5);
            color: white;
        }
        
        .btn-verify i {
            margin-right: 8px;
        }
        
        .btn-resend {
            background: transparent;
            border: none;
            color: #667eea;
            text-decoration: underline;
            cursor: pointer;
        }
        
        .btn-resend:hover {
            color: #764ba2;
        }
        
        .alert {
            border-radius: 12px;
            border: none;
            padding: 12px 18px;
            font-size: 14px;
            animation: shake 0.5s;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .alert-danger {
            background: #fee2e2;
            color: #991b1b;
        }
        
        .alert-success {
            background: #d1fae5;
            color: #065f46;
        }
        
        .alert-info {
            background: #dbeafe;
            color: #1e40af;
        }
        
        .alert-warning {
            background: #fef3c7;
            color: #92400e;
        }
        
        .logout-link {
            color: #e74c3c;
            text-decoration: none;
            font-size: 13px;
        }
        
        .logout-link:hover {
            text-decoration: underline;
        }
        
        .decorative {
            position: fixed;
            border-radius: 50%;
            opacity: 0.1;
            pointer-events: none;
        }
        
        .decorative-1 {
            width: 300px;
            height: 300px;
            background: white;
            top: -100px;
            right: -100px;
        }
        
        .decorative-2 {
            width: 200px;
            height: 200px;
            background: white;
            bottom: -50px;
            left: -50px;
        }
        
        @media (max-width: 480px) {
            .otp-card {
                padding: 30px 20px;
            }
            
            .clinic-name {
                font-size: 24px;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Decorative elements -->
    <div class="decorative decorative-1"></div>
    <div class="decorative decorative-2"></div>
    
    <div class="otp-wrapper">
        <div class="otp-card">
            <!-- Logo -->
            <div class="logo-section">
                <div class="logo-icon">
                    <i class="fas fa-gem"></i>
                </div>
                <div class="clinic-name">
                    Dora's <span>Dental Gem</span>
                </div>
                <div class="clinic-tagline">
                    <i class="fas fa-tooth me-1"></i> Quality Dental Care
                </div>
            </div>
            
            {% block content %}{% endblock %}
            
            <div class="text-center mt-3">
                <small>
                    <form method="post" action="{% url 'core:logout' %}" style="display:inline">{% csrf_token %}<button type="submit" class="btn btn-link text-danger p-0 logout-link">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button></form>
                </small>
            </div>
            
            <div class="footer-text text-center mt-3">
                <small class="text-muted">
                    <i class="fas fa-heart" style="color: #ef4444;"></i> Dora's Dental Gem &bull; 2026
                </small>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}

<script>
/*
 * Dorah Dental - Universal Form Draft Protection
 *
 * Keeps non-sensitive form data in the browser so an accidental
 * refresh or server-side validation error does not force re-entry.
 *
 * Drafts are:
 *   - saved while the user types/changes fields
 *   - restored on reload
 *   - cleared after a successful save (success message)
 *   - cleared when leaving the form page, unless the next load is
 *     simply the successful POST redirect
 *   - never saved for file inputs or sensitive fields
 */
(function () {
    'use strict';

    var STORAGE_PREFIX = 'dorah_dental_form_draft_v1:';
    var PAGE_KEY = window.location.pathname;
    var SESSION_PAGE_KEY = 'dorah_dental_previous_form_page';
    var MAX_AGE = 7 * 24 * 60 * 60 * 1000;

    function isSensitive(field) {
        var name = (field.name || '').toLowerCase();
        var type = (field.type || '').toLowerCase();

        if (!name || type === 'file') return true;

        return (
            type === 'password' ||
            /(^|[_-])(password|passwd|passcode|otp|one_time_password|token|secret|pin|verification_code|security_code)([_-]|$)/i.test(name)
        );
    }

    function isTrackableForm(form) {
        if (!form || !form.elements) return false;

        var method = (form.getAttribute('method') || 'get').toLowerCase();
        if (method !== 'post') return false;

        if (form.hasAttribute('data-draft-disabled')) return false;

        var action = (form.getAttribute('action') || '').toLowerCase();

        /* Never draft logout/delete/CSRF-only confirmation forms. */
        if (/logout|delete|signout|sign-out/.test(action)) return false;

        var fields = Array.prototype.slice.call(form.elements);
        return fields.some(function (field) {
            return field.name && !isSensitive(field) &&
                   ['submit', 'button', 'reset', 'hidden'].indexOf((field.type || '').toLowerCase()) === -1;
        });
    }

    function getForms() {
        return Array.prototype.slice.call(document.querySelectorAll('form'))
            .filter(isTrackableForm);
    }

    function getFormId(form, index) {
        var explicit = form.getAttribute('id') ||
                       form.getAttribute('name') ||
                       form.getAttribute('data-form-name');

        if (explicit) return explicit;

        var action = form.getAttribute('action') || window.location.pathname;
        return action + '::' + index;
    }

    function storageKey(formId) {
        return STORAGE_PREFIX + PAGE_KEY + '::' + formId;
    }

    function collect(form) {
        var data = {};
        var fields = Array.prototype.slice.call(form.elements);

        fields.forEach(function (field, index) {
            var name = field.name;
            var type = (field.type || '').toLowerCase();

            if (!name || isSensitive(field) ||
                ['submit', 'button', 'reset', 'file'].indexOf(type) !== -1) {
                return;
            }

            var key = name + '::' + index;

            if (type === 'checkbox' || type === 'radio') {
                data[key] = {
                    name: name,
                    type: type,
                    checked: !!field.checked,
                    value: field.value
                };
            } else if (field.tagName.toLowerCase() === 'select' && field.multiple) {
                data[key] = {
                    name: name,
                    type: 'select-multiple',
                    values: Array.prototype.slice.call(field.selectedOptions)
                        .map(function (option) { return option.value; })
                };
            } else {
                data[key] = {
                    name: name,
                    type: type,
                    value: field.value
                };
            }
        });

        return data;
    }

    function save(form, formId) {
        try {
            var payload = {
                version: 1,
                savedAt: Date.now(),
                page: PAGE_KEY,
                formId: formId,
                data: collect(form)
            };

            localStorage.setItem(storageKey(formId), JSON.stringify(payload));
            sessionStorage.setItem(SESSION_PAGE_KEY, PAGE_KEY);
        } catch (e) {
            /* Storage can be disabled/full; the form must still work normally. */
        }
    }

    function restore(form, formId) {
        try {
            var raw = localStorage.getItem(storageKey(formId));
            if (!raw) return false;

            var payload = JSON.parse(raw);

            if (!payload || payload.version !== 1 ||
                !payload.savedAt ||
                Date.now() - payload.savedAt > MAX_AGE) {
                localStorage.removeItem(storageKey(formId));
                return false;
            }

            var fields = Array.prototype.slice.call(form.elements);
            var restored = false;

            Object.keys(payload.data || {}).forEach(function (key) {
                var item = payload.data[key];
                var parts = key.split('::');
                var index = parseInt(parts[parts.length - 1], 10);
                var field = fields[index];

                if (!field || field.name !== item.name || isSensitive(field)) return;

                var type = (field.type || '').toLowerCase();

                if (item.type === 'checkbox' || item.type === 'radio') {
                    field.checked = !!item.checked;
                    restored = true;
                } else if (item.type === 'select-multiple') {
                    var values = item.values || [];
                    Array.prototype.forEach.call(field.options, function (option) {
                        option.selected = values.indexOf(option.value) !== -1;
                    });
                    restored = true;
                } else if (type !== 'file') {
                    /*
                     * Do not overwrite browser/autofill values that appeared
                     * after the draft was saved.
                     */
                    if (field.value === '' || field.value === null) {
                        field.value = item.value == null ? '' : item.value;
                        restored = true;
                    } else if (item.value !== field.value) {
                        /*
                         * If the field already contains a value, prefer the
                         * saved draft only when it is not an authentication
                         * field (those are excluded above).
                         */
                        field.value = item.value == null ? '' : item.value;
                        restored = true;
                    }
                }
            });

            if (restored) {
                form.dispatchEvent(new CustomEvent('draftrestored', {
                    bubbles: true,
                    detail: { formId: formId }
                }));

                /*
                 * Trigger change/input so Select2 and other dependent UI
                 * components can recalculate their values.
                 */
                fields.forEach(function (field) {
                    if (field.name && !isSensitive(field)) {
                        try {
                            field.dispatchEvent(new Event('change', { bubbles: true }));
                        } catch (e) {}
                    }
                });
            }

            return restored;
        } catch (e) {
            return false;
        }
    }

    function clear(formId) {
        try {
            localStorage.removeItem(storageKey(formId));
        } catch (e) {}
    }

    function clearPageDrafts() {
        try {
            var prefix = STORAGE_PREFIX + PAGE_KEY + '::';
            var keys = [];

            for (var i = 0; i < localStorage.length; i++) {
                var key = localStorage.key(i);
                if (key && key.indexOf(prefix) === 0) keys.push(key);
            }

            keys.forEach(function (key) {
                localStorage.removeItem(key);
            });
        } catch (e) {}
    }

    function clearPreviousPageDrafts() {
        try {
            var previousPage = sessionStorage.getItem(SESSION_PAGE_KEY);

            if (previousPage && previousPage !== PAGE_KEY) {
                var prefix = STORAGE_PREFIX + previousPage + '::';
                var keys = [];

                for (var i = 0; i < localStorage.length; i++) {
                    var key = localStorage.key(i);
                    if (key && key.indexOf(prefix) === 0) keys.push(key);
                }

                keys.forEach(function (key) {
                    localStorage.removeItem(key);
                });
            }

            sessionStorage.setItem(SESSION_PAGE_KEY, PAGE_KEY);
        } catch (e) {}
    }

    function hasSuccessMessage() {
        /*
         * The application uses Bootstrap toast headers with bg-success
         * for successful saves.
         */
        return !!document.querySelector(
            '.toast-header.bg-success, .alert-success, [data-draft-saved="true"]'
        );
    }

    function init() {
        clearPreviousPageDrafts();

        var forms = getForms();

        forms.forEach(function (form, index) {
            var formId = getFormId(form, index);

            /*
             * If Django redirected back with a success message, the save
             * completed successfully, so remove the old draft.
             */
            if (hasSuccessMessage()) {
                clear(formId);
            } else {
                restore(form, formId);
            }

            var timer = null;

            function persist() {
                window.clearTimeout(timer);
                timer = window.setTimeout(function () {
                    save(form, formId);
                }, 150);
            }

            form.addEventListener('input', persist, true);
            form.addEventListener('change', persist, true);

            form.addEventListener('submit', function () {
                /*
                 * Save immediately before POST. If Django returns the same
                 * page with validation errors, the draft is available.
                 */
                save(form, formId);
            }, true);

            form.addEventListener('reset', function () {
                window.setTimeout(function () {
                    clear(formId);
                }, 0);
            });

            /*
             * Public helper for pages with custom successful AJAX saves.
             */
            form.dorahClearDraft = function () {
                clear(formId);
            };
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }

    window.DorahDentalDrafts = {
        clearCurrentPage: clearPageDrafts
    };
})();
</script>

</body>
</html>
