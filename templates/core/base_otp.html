<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dora's Dental Gem - {% block title %}OTP Verification{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .otp-wrapper {
            width: 100%;
            max-width: 450px;
        }
        
        .otp-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 45px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: slideUp 0.8s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo-icon {
            display: inline-block;
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            line-height: 80px;
            font-size: 40px;
            color: white;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            margin-bottom: 15px;
        }
        
        .clinic-name {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 700;
            color: #2d3436;
            margin-bottom: 5px;
        }
        
        .clinic-name span {
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .clinic-tagline {
            color: #636e72;
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 2px;
        }
        
        .otp-title {
            font-size: 22px;
            font-weight: 600;
            color: #2d3436;
            margin-bottom: 8px;
            text-align: center;
        }
        
        .otp-subtitle {
            color: #636e72;
            font-size: 14px;
            margin-bottom: 25px;
            text-align: center;
        }
        
        .otp-input {
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 10px;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #dee2e6;
            transition: all 0.3s;
        }
        
        .otp-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        
        .btn-verify {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            width: 100%;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-verify:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(102, 126, 234, 0.5);
            color: white;
        }
        
        .btn-verify i {
            margin-right: 8px;
        }
        
        .btn-resend {
            background: transparent;
            border: none;
            color: #667eea;
            text-decoration: underline;
            cursor: pointer;
        }
        
        .btn-resend:hover {
            color: #764ba2;
        }
        
        .alert {
            border-radius: 12px;
            border: none;
            padding: 12px 18px;
            font-size: 14px;
            animation: shake 0.5s;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .alert-danger {
            background: #fee2e2;
            color: #991b1b;
        }
        
        .alert-success {
            background: #d1fae5;
            color: #065f46;
        }
        
        .alert-info {
            background: #dbeafe;
            color: #1e40af;
        }
        
        .alert-warning {
            background: #fef3c7;
            color: #92400e;
        }
        
        .logout-link {
            color: #e74c3c;
            text-decoration: none;
            font-size: 13px;
        }
        
        .logout-link:hover {
            text-decoration: underline;
        }
        
        .decorative {
            position: fixed;
            border-radius: 50%;
            opacity: 0.1;
            pointer-events: none;
        }
        
        .decorative-1 {
            width: 300px;
            height: 300px;
            background: white;
            top: -100px;
            right: -100px;
        }
        
        .decorative-2 {
            width: 200px;
            height: 200px;
            background: white;
            bottom: -50px;
            left: -50px;
        }
        
        @media (max-width: 480px) {
            .otp-card {
                padding: 30px 20px;
            }
            
            .clinic-name {
                font-size: 24px;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Decorative elements -->
    <div class="decorative decorative-1"></div>
    <div class="decorative decorative-2"></div>
    
    <div class="otp-wrapper">
        <div class="otp-card">
            <!-- Logo -->
            <div class="logo-section">
                <div class="logo-icon">
                    <i class="fas fa-gem"></i>
                </div>
                <div class="clinic-name">
                    Dora's <span>Dental Gem</span>
                </div>
                <div class="clinic-tagline">
                    <i class="fas fa-tooth me-1"></i> Quality Dental Care
                </div>
            </div>
            
            {% block content %}{% endblock %}
            
            <div class="text-center mt-3">
                <small>
                    <form method="post" action="{% url 'core:logout' %}" style="display:inline">{% csrf_token %}<button type="submit" class="btn btn-link text-danger p-0 logout-link">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button></form>
                </small>
            </div>
            
            <div class="footer-text text-center mt-3">
                <small class="text-muted">
                    <i class="fas fa-heart" style="color: #ef4444;"></i> Dora's Dental Gem &bull; 2026
                </small>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
