name: dental_clinic_app
description: Dental Clinic Management System - Complete Mobile App
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Core
  provider: ^6.0.5
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # Networking
  dio: ^5.3.3
  http: ^1.1.0
  
  # UI Components
  flutter_svg: ^2.0.9
  flutter_slidable: ^3.0.1
  pull_to_refresh: ^2.0.0
  badges: ^3.1.2
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  
  # Forms - ✅ UPGRADED TO VERSION 10
  flutter_form_builder: ^10.0.0
  
  # Date & Time
  intl: ^0.20.2
  timezone: ^0.9.2
  table_calendar: ^3.0.9
  
  # Localization
  flutter_localizations:
    sdk: flutter
  
  # Utils
  connectivity_plus: ^5.0.1
  url_launcher: ^6.1.14
  permission_handler: ^11.0.1
  
  # Charts
  fl_chart: ^0.64.0
  
  # PDF & Printing
  printing: ^5.11.1
  pdf: ^3.10.4
  
  # Image Picker
  image_picker: ^1.0.4
  
  # QR Code
  qr_flutter: ^4.1.0
  
  # Device Info
  device_info_plus: ^9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
