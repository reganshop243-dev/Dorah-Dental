{% extends 'base.html' %}
{% load static %}

{% block page_title %}Edit Appointment{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <i class="fas fa-edit text-primary"></i> Edit Appointment
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="patient" class="form-label">Patient *</label>
                        <select class="form-select" id="patient" name="patient" required>
                            {% for patient in patients %}
                                <option value="{{ patient.pk }}" {% if appointment.patient.pk == patient.pk %}selected{% endif %}>
                                    {{ patient.full_name }} - {{ patient.phone }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="doctor" class="form-label">Doctor *</label>
                        <select class="form-select" id="doctor" name="doctor" required>
                            {% for doctor in doctors %}
                                <option value="{{ doctor.pk }}" {% if appointment.doctor.pk == doctor.pk %}selected{% endif %}>
                                    Dr. {{ doctor.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="service" class="form-label">Service *</label>
                        <select class="form-select" id="service" name="service" required>
                            {% for service in services %}
                                <option value="{{ service.pk }}" {% if appointment.service.pk == service.pk %}selected{% endif %}>
                                    {{ service.name }} - UGX {{ service.price }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="appointment_date" class="form-label">Date *</label>
                            <input type="date" class="form-control" id="appointment_date" name="appointment_date" 
                                   value="{{ appointment.appointment_date|date:'Y-m-d' }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="appointment_time" class="form-label">Time *</label>
                            <input type="time" class="form-control" id="appointment_time" name="appointment_time" 
                                   value="{{ appointment.appointment_time|time:'H:i' }}" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="status" class="form-label">Status</label>
                        <select class="form-select" id="status" name="status">
                            {% for status_code, status_label in appointment.STATUS_CHOICES %}
                                <option value="{{ status_code }}" {% if appointment.status == status_code %}selected{% endif %}>
                                    {{ status_label }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="notes" class="form-label">Notes</label>
                        <textarea class="form-control" id="notes" name="notes" rows="3">{{ appointment.notes }}</textarea>
                    </div>
                    
<hr>

<!-- Treatment Details -->
<h6 class="text-muted mb-3"><i class="fas fa-notes-medical"></i> Treatment Details</h6>

<div class="mb-3">
    <label for="diagnosis" class="form-label">Diagnosis</label>
    <input type="text" class="form-control" id="diagnosis" name="diagnosis" 
           value="{{ appointment.diagnosis }}" placeholder="e.g., Dental Caries, Periodontitis">
</div>

<div class="mb-3">
    <label for="consultation_notes" class="form-label">Consultation Notes</label>
    <textarea class="form-control" id="consultation_notes" name="consultation_notes" rows="3">{{ appointment.consultation_notes }}</textarea>
</div>

<div class="mb-3">
    <label for="treatment_plan" class="form-label">Treatment Plan</label>
    <textarea class="form-control" id="treatment_plan" name="treatment_plan" rows="3">{{ appointment.treatment_plan }}</textarea>
</div>

<div class="mb-3">
    <label for="prescription" class="form-label">Prescription</label>
    <textarea class="form-control" id="prescription" name="prescription" rows="3">{{ appointment.prescription }}</textarea>
</div>

<div class="row">
    <div class="col-md-6 mb-3">
        <label for="treatment_cost" class="form-label">Treatment Cost (UGX)</label>
        <input type="number" step="0.01" class="form-control" id="treatment_cost" name="treatment_cost" 
               value="{{ appointment.treatment_cost }}">
    </div>
    <div class="col-md-6 mb-3">
        <label for="referred_to" class="form-label">Referred To</label>
        <input type="text" class="form-control" id="referred_to" name="referred_to" 
               value="{{ appointment.referred_to }}" placeholder="e.g., Specialist Name">
    </div>
</div>

<div class="row">
    <div class="col-md-6 mb-3">
        <label for="follow_up_date" class="form-label">Follow-up Date</label>
        <input type="date" class="form-control" id="follow_up_date" name="follow_up_date" 
               value="{{ appointment.follow_up_date|date:'Y-m-d' }}">
    </div>
    <div class="col-md-6 mb-3">
        <label for="follow_up_notes" class="form-label">Follow-up Notes</label>
        <input type="text" class="form-control" id="follow_up_notes" name="follow_up_notes" 
               value="{{ appointment.follow_up_notes }}" placeholder="Reason for follow-up">
    </div>
</div>

                    <div class="d-flex justify-content-between">
                        <a href="{% url 'appointments:detail' appointment.pk %}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Update Appointment
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
