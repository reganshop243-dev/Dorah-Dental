{% extends 'base_portal.html' %}
{% load static %}

{% block title %}Patient Portal Login{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center min-vh-100 align-items-center">
        <div class="col-md-5">
            <div class="card shadow-lg">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <img src="{% static 'images/logo.png' %}" alt="Logo" height="60">
                        <h2 class="mt-3">Patient Portal</h2>
                        <p class="text-muted">Access your dental records securely</p>
                    </div>
                    
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="identifier" class="form-label">
                                <i class="fas fa-user"></i> Patient ID or Phone Number
                            </label>
                            <input type="text" class="form-control form-control-lg" id="identifier" 
                                   name="identifier" placeholder="e.g., 12345 or 0700123456" required autofocus>
                        </div>
                        
                        <div class="mb-3">
                            <label for="pin" class="form-label">
                                <i class="fas fa-lock"></i> PIN
                            </label>
                            <input type="password" class="form-control form-control-lg" id="pin" 
                                   name="pin" placeholder="Enter your 6-digit PIN" required maxlength="6">
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-sign-in-alt"></i> Login
                            </button>
                        </div>
                    </form>
                    
                    <div class="text-center mt-3">
                        <small class="text-muted">
                            <i class="fas fa-info-circle"></i> 
                            If you don't have a PIN, please contact the clinic reception.
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
