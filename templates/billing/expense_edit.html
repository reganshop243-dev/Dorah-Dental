{% extends 'base.html' %}
{% load static %}

{% block page_title %}Edit Expense{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card">
            <div class="card-header">
                <i class="fas fa-edit text-primary"></i> Edit Expense
            </div>
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Description <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="description" value="{{ expense.description }}" required>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Category <span class="text-danger">*</span></label>
                            <select class="form-select" name="category" required>
                                {% for code, name in categories %}
                                    <option value="{{ code }}" {% if expense.category == code %}selected{% endif %}>
                                        {{ name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Amount (UGX) <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" class="form-control" name="amount" value="{{ expense.amount }}" required>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Expense Date</label>
                            <input type="date" class="form-control" name="expense_date" value="{{ expense.expense_date|date:'Y-m-d' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Payment Method</label>
                            <select class="form-select" name="payment_method">
                                {% for code, name in payment_methods %}
                                    <option value="{{ code }}" {% if expense.payment_method == code %}selected{% endif %}>
                                        {{ name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Reference Number</label>
                            <input type="text" class="form-control" name="reference_number" value="{{ expense.reference_number }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Receipt</label>
                            {% if expense.receipt %}
                                <div class="mb-2">
                                    <span class="badge bg-success">
                                        <i class="fas fa-check"></i> Current receipt uploaded
                                    </span>
                                    <br>
                                    <small class="text-muted">
                                        <a href="{{ expense.receipt.url }}" target="_blank">View current receipt</a>
                                    </small>
                                </div>
                            {% endif %}
                            <input type="file" class="form-control" name="receipt" accept="image/*,.pdf">
                            <div class="help-text">Upload new receipt to replace existing</div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Notes</label>
                        <textarea class="form-control" name="notes" rows="3">{{ expense.notes }}</textarea>
                    </div>
                    
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'billing:expense_list' %}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Update Expense
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
