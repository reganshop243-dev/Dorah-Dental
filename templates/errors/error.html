{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ status_code }} · Dorah Dental</title>
    <style>
        body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;color:#1f2937;font-family:Arial,sans-serif}
        .card{width:min(520px,calc(100% - 32px));background:#fff;border-radius:18px;padding:38px;box-shadow:0 12px 40px rgba(0,0,0,.08);text-align:center}
        .code{font-size:52px;font-weight:800;color:#2563eb;margin-bottom:8px}
        h1{margin:0 0 12px;font-size:25px}
        p{line-height:1.6;color:#667085}
        .ref{margin-top:24px;padding:12px;background:#f3f4f6;border-radius:10px;font-family:monospace;font-size:13px}
        a{display:inline-block;margin-top:22px;padding:12px 20px;border-radius:10px;background:#2563eb;color:white;text-decoration:none}
    </style>
</head>
<body>
<div class="card">
    <div class="code">{{ status_code }}</div>
    <h1>{{ error_title }}</h1>
    <p>{{ error_message }}</p>
    <div class="ref">Reference: <strong>{{ error_reference }}</strong></div>
    <a href="{% url 'core:login' %}">Return to login</a>
</div>
</body>
</html>
