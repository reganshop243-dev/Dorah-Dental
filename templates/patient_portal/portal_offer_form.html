{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}<div class="container-fluid py-4"><div class="card shadow-sm"><div class="card-body"><form method="post" enctype="multipart/form-data">{% csrf_token %}<div class="mb-3"><label class="form-label">Title</label><input name="title" class="form-control" required value="{{ offer.title|default:'' }}"></div><div class="mb-3"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="6" required>{{ offer.description|default:'' }}</textarea></div><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Valid From</label><input type="date" name="valid_from" class="form-control" value="{{ offer.valid_from|date:'Y-m-d' }}"></div><div class="col-md-6 mb-3"><label class="form-label">Valid Until</label><input type="date" name="valid_until" class="form-control" value="{{ offer.valid_until|date:'Y-m-d' }}"></div></div><div class="mb-3"><label class="form-label">Image</label><input type="file" name="image" class="form-control" accept="image/*">{% if offer.image %}<small class="text-muted">Current image: {{ offer.image.name }}</small>{% endif %}</div><div class="form-check mb-4"><input class="form-check-input" type="checkbox" name="is_published" id="published" {% if offer is None or offer.is_published %}checked{% endif %}><label class="form-check-label" for="published">Publish to patient portal</label></div><a class="btn btn-secondary" href="{% url 'patient_portal:portal_content' %}">Cancel</a> <button class="btn btn-primary" type="submit">Save Clinic Offer</button></form></div></div></div>{% endblock %}
