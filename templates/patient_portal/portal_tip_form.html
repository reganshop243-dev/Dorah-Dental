{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}<div class="container-fluid py-4"><div class="card shadow-sm"><div class="card-body"><form method="post" enctype="multipart/form-data">{% csrf_token %}<div class="mb-3"><label class="form-label">Title</label><input name="title" class="form-control" required value="{{ tip.title|default:'' }}"></div><div class="mb-3"><label class="form-label">Content</label><textarea name="content" class="form-control" rows="8" required>{{ tip.content|default:'' }}</textarea></div><div class="mb-3"><label class="form-label">Image</label><input type="file" name="image" class="form-control" accept="image/*">{% if tip.image %}<small class="text-muted">Current image: {{ tip.image.name }}</small>{% endif %}</div><div class="form-check mb-4"><input class="form-check-input" type="checkbox" name="is_published" id="published" {% if tip is None or tip.is_published %}checked{% endif %}><label class="form-check-label" for="published">Publish to patient portal</label></div><a class="btn btn-secondary" href="{% url 'patient_portal:portal_content' %}">Cancel</a> <button class="btn btn-primary" type="submit">Save Dental Tip</button></form></div></div></div>{% endblock %}
