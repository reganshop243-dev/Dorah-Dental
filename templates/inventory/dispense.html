{% extends 'base.html' %}
{% load static %}
{% load humanize %}

{% block page_title %}Dispense Supplies{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <i class="fas fa-hand-holding-heart text-success"></i> Dispense Supplies to Patient
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Patient *</label>
                        <select class="form-select" name="patient" required>
                            <option value="">Select Patient</option>
                            {% for patient in patients %}
                                <option value="{{ patient.id }}">{{ patient.full_name }} - {{ patient.phone }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Supply Item *</label>
                        <select class="form-select" name="item" required>
                            <option value="">Select Supply</option>
                            {% for item in items %}
                                <option value="{{ item.id }}">
                                    {{ item.name }} - Stock: {{ item.quantity }} - UGX {{ item.selling_price|floatformat:0|intcomma }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Quantity *</label>
                        <input type="number" class="form-control" name="quantity" value="1" min="1" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Notes</label>
                        <textarea class="form-control" name="notes" rows="2" placeholder="Reason for dispensing..."></textarea>
                    </div>
                    
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'inventory:list' %}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-check"></i> Dispense & Create Invoice
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
