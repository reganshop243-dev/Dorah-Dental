{% extends 'base.html' %}
{% block content %}
<div class="container py-4" style="max-width:650px;">
  <div class="card border-danger shadow-sm">
    <div class="card-header bg-danger text-white"><i class="fas fa-trash me-2"></i>Remove Service</div>
    <div class="card-body">
      <h5>Remove "{{ service.name }}"?</h5>
      <p class="text-muted mb-4">The service will be deactivated and will no longer appear in the active services list. Existing invoice records are preserved.</p>
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger"><i class="fas fa-trash me-1"></i>Yes, Remove Service</button>
        <a href="{% url 'appointments:services' %}" class="btn btn-secondary">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
