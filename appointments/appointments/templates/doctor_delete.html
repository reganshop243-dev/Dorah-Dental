{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0"><i class="fas fa-exclamation-triangle me-2"></i> Remove Doctor</h5>
            </div>
            <div class="card-body text-center py-4">
                <p class="mb-3">Are you sure you want to remove <strong>Dr. {{ doctor.name }}</strong>?</p>
                <p class="text-muted small">This will only deactivate the doctor. Appointments will be preserved.</p>
                
                <form method="post" class="mt-3">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2">
                        <button type="submit" class="btn btn-danger">
                            <i class="fas fa-trash"></i> Yes, Remove
                        </button>
                        <a href="{% url 'appointments:doctors' %}" class="btn btn-secondary">
                            <i class="fas fa-times"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
